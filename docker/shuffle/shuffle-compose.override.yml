services:
  frontend:
    image: ghcr.io/shuffle/shuffle-frontend:2.2.1
    ports: !override
      - "10.77.30.10:3001:80"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  backend:
    image: ghcr.io/shuffle/shuffle-backend:2.2.1
    ports: !override
      - "127.0.0.1:5001:5001"
    env_file: !override
      - /opt/soc-lab/secrets/shuffle.env
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  orborus:
    image: ghcr.io/shuffle/shuffle-orborus:2.2.1
    env_file: !override
      - /opt/soc-lab/secrets/shuffle.env
    environment:
      - SHUFFLE_SWARM_CONFIG=
      - SHUFFLE_WORKER_IMAGE=ghcr.io/shuffle/shuffle-worker:2.2.1
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  opensearch:
    ports: !override []
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms2G -Xmx2G"
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
