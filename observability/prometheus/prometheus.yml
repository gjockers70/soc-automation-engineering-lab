global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: soc-integration
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.77.30.10:8010
