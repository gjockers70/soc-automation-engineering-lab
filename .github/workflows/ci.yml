name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            detections/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -r detections/requirements.txt

      - name: Lint Python
        run: ruff check src tests tools

      - name: Validate repository assets and links
        run: python tools/validate_repository.py

      - name: Validate detections
        run: |
          python detections/validate.py
          python detections/validate_with_pysigma.py

      - name: Validate GitHub Actions syntax
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          printf -v archive 'actionlint_%s_linux_amd64.tar.gz' "$ACTIONLINT_VERSION"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" actionlint
          ./actionlint

      - name: Run mocked test suite
        run: python -m pytest
